<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#efe4d0" />
  <title>Lane Out</title>
  <style>
    :root, [data-theme="paper"] {
      --page: #e8dcc6;
      --panel: #f4ead8;
      --board: #f4ead8;
      --ink: #5b3f25;
      --title: #b8782f;
      --muted: #a08868;
      --line: #dcc9a8;
      --accent: #2f86d6;
      --danger: #d64532;
      --btn: #fbf6ec;
      --shadow: rgba(91, 63, 37, 0.18);
    }
    [data-theme="night"] {
      --page: #0f1218;
      --panel: #171b24;
      --board: #171b24;
      --ink: #d6dde8;
      --title: #f0b35a;
      --muted: #7c8799;
      --line: #2a303d;
      --accent: #5aa9ff;
      --danger: #ff6b5a;
      --btn: #222836;
      --shadow: rgba(0, 0, 0, 0.45);
    }
    [data-theme="mint"] {
      --page: #d6e9df;
      --panel: #eaf5ef;
      --board: #eaf5ef;
      --ink: #1f4a3a;
      --title: #2f8a63;
      --muted: #6f9886;
      --line: #c3ddd0;
      --accent: #e0772f;
      --danger: #d64532;
      --btn: #f6fbf8;
      --shadow: rgba(31, 74, 58, 0.16);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--page);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: background .3s;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }

    .app {
      position: relative;
      width: 100%; max-width: 440px;
      height: 100dvh; max-height: 920px;
      background: var(--panel);
      display: flex; flex-direction: column;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      transition: background .3s;
    }
    @media (min-width: 520px) {
      .app { border-radius: 34px; height: 94dvh; box-shadow: 0 30px 70px -20px var(--shadow); }
    }

    .bar { display: grid; grid-template-columns: 44px 1fr 44px 44px; align-items: center; gap: 4px; padding: 14px 16px 10px; border-bottom: 2px solid var(--line); }
    .bar h1 { margin: 0; text-align: center; font-size: 22px; font-weight: 800; color: var(--title); letter-spacing: .01em; }
    .ico { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; color: var(--muted); }
    .ico:active { transform: scale(.92); }
    .ico svg { width: 24px; height: 24px; }

    .status { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px 0; min-height: 40px; }
    .drops { display: flex; gap: 6px; }
    .drop { width: 18px; height: 24px; transition: transform .25s, opacity .25s; }
    .drop.lost { opacity: .22; transform: scale(.8); filter: grayscale(1); }
    .drop.shake { animation: shake .4s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .left { font-size: 13px; font-weight: 800; color: var(--muted); }

    .tip { margin: 6px 22px 0; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; min-height: 18px; transition: opacity .3s; }

    .stage { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .tools { display: flex; justify-content: center; gap: 48px; padding: 8px 0 22px; }
    .tool {
      position: relative; width: 62px; height: 62px; border-radius: 50%;
      background: var(--btn); color: var(--ink);
      box-shadow: 0 6px 16px -6px var(--shadow), inset 0 0 0 2px var(--line);
      display: grid; place-items: center;
    }
    .tool:active { transform: scale(.93); }
    .tool svg { width: 28px; height: 28px; }
    .tool.on { color: var(--accent); box-shadow: 0 6px 16px -6px var(--shadow), inset 0 0 0 2px var(--accent); }
    .badge {
      position: absolute; top: -2px; right: -2px; min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 11px; background: var(--danger); color: #fff; font-size: 12px; font-weight: 900;
      display: grid; place-items: center; border: 2px solid var(--panel);
    }
    .badge.zero { background: var(--muted); }

    /* Overlays */
    .veil { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 28px; background: color-mix(in srgb, var(--page) 55%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
    .veil.show { display: flex; }
    .sheet {
      width: 100%; background: var(--panel); border-radius: 28px; padding: 28px 24px 22px; text-align: center;
      box-shadow: 0 30px 60px -20px var(--shadow), inset 0 0 0 2px var(--line);
      animation: pop .28s cubic-bezier(.3,1.5,.6,1);
    }
    @keyframes pop { from { transform: scale(.86); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .sheet h2 { margin: 0; font-size: 30px; font-weight: 900; color: var(--title); }
    .sheet p { margin: 8px 0 0; color: var(--muted); font-weight: 700; font-size: 15px; line-height: 1.45; }
    .logo { width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 22px; background: var(--btn); box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; }
    .cta { margin-top: 22px; width: 100%; padding: 16px; border-radius: 16px; background: var(--title); color: #fff; font-size: 18px; font-weight: 900; box-shadow: 0 8px 18px -8px var(--shadow); }
    .cta:active { transform: scale(.97); }
    .cta.alt { background: transparent; color: var(--muted); box-shadow: none; margin-top: 8px; padding: 10px; font-size: 15px; }
    .result-drops { display: flex; justify-content: center; gap: 10px; margin: 18px 0 4px; }
    .result-drops .drop { width: 30px; height: 40px; }
    .opt { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 2px solid var(--line); font-weight: 800; }
    .opt:last-of-type { border-bottom: 0; }
    .switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .2s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
    .switch.on { background: var(--accent); }
    .switch.on::after { transform: translateX(20px); }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <button class="ico" id="homeBtn" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <h1 id="levelTitle">Level 1</h1>
    <button class="ico" id="themeBtn" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.7-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg>
    </button>
    <button class="ico" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/><circle cx="12" cy="12" r="3.2"/></svg>
    </button>
  </div>

  <div class="status">
    <div class="drops" id="drops"></div>
    <div class="left" id="leftCount"></div>
  </div>
  <div class="tip" id="tip"></div>

  <div class="stage" id="stage"><canvas id="cv"></canvas></div>

  <div class="tools">
    <button class="tool" id="gridBtn" aria-label="Toggle grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
    </button>
    <button class="tool" id="hintBtn" aria-label="Hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/><path d="M10 10.5l1 1.5 1-1.5 1 1.5 1-1.5"/></svg>
      <span class="badge" id="hintBadge">3</span>
    </button>
  </div>

  <!-- Start -->
  <div class="veil show" id="startVeil">
    <div class="sheet">
      <div class="logo">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 44V22h14v14h22" stroke="var(--title)" stroke-width="5"/>
          <path d="M40 30l6 6-6 6" stroke="var(--title)" stroke-width="5"/>
          <path d="M32 26V10" stroke="var(--ink)" stroke-width="5"/>
          <path d="M26 16l6-6 6 6" stroke="var(--ink)" stroke-width="5"/>
        </svg>
      </div>
      <h2>Lane Out</h2>
      <p id="startLevel">Level 1</p>
      <button class="cta" id="playBtn">Play</button>
    </div>
  </div>

  <!-- Win -->
  <div class="veil" id="winVeil">
    <div class="sheet">
      <h2 id="winTitle">Board clear!</h2>
      <div class="result-drops" id="winDrops"></div>
      <p id="winText"></p>
      <button class="cta" id="nextBtn">Next level</button>
      <button class="cta alt" id="replayBtn">Replay</button>
    </div>
  </div>

  <!-- Lose -->
  <div class="veil" id="loseVeil">
    <div class="sheet">
      <h2>Out of drops</h2>
      <p>Every 💧 is gone. Look before you tap: hold a line down to see where it will go.</p>
      <button class="cta" id="retryBtn">Try again</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="veil" id="setVeil">
    <div class="sheet" style="text-align:left">
      <h2 style="text-align:center;margin-bottom:10px">Settings</h2>
      <div class="opt"><span>Sound</span><button class="switch on" id="swSound" aria-label="Sound"></button></div>
      <div class="opt"><span>Vibration</span><button class="switch on" id="swVibe" aria-label="Vibration"></button></div>
      <div class="opt"><span>Restart level</span><button class="ico" id="restartBtn" aria-label="Restart" style="color:var(--title)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg></button></div>
      <button class="cta" id="setClose">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ================= Persistence =================
  const KEY = 'laneOut.v1';
  const save = { level: 1, theme: null, sound: true, vibe: true, best: {} };
  try { Object.assign(save, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  // ================= Audio =================
  let actx = null;
  function audio() {
    if (!save.sound) return null;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { return null; }
    return actx;
  }
  function whoosh(len) {
    const a = audio(); if (!a) return;
    const dur = 0.22 + Math.min(0.25, len * 0.012);
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(500, a.currentTime);
    f.frequency.exponentialRampToValueAtTime(2600, a.currentTime + dur);
    const g = a.createGain(); g.gain.value = 0.35;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }
  function tone(freq, dur, vol, type = 'sine', delay = 0) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
  }
  const bumpSound = () => { tone(120, 0.18, 0.3, 'triangle'); tone(80, 0.25, 0.2, 'sine', 0.03); };
  const winSound = () => [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 0.3, 0.12, 'sine', i * 0.08));
  const hintSound = () => { tone(880, 0.12, 0.08); tone(1175, 0.16, 0.07, 'sine', 0.07); };
  const vibe = (p) => { if (save.vibe) try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  // ================= Level generation =================
  // Every level is solvable by construction: lines are placed one at a time, and each new
  // line's exit lane must be free of all lines placed before it. Removing lines in reverse
  // placement order therefore always works; the player has to discover that order.
  function mulberry(seed) {
    return () => {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

  const ascii = (rows) => (nx, ny) => {
    const h = rows.length, w = rows[0].length;
    const r = Math.min(h - 1, Math.floor((ny + 1) / 2 * h));
    const c = Math.min(w - 1, Math.floor((nx + 1) / 2 * w));
    return rows[r][c] === '#';
  };
  const SHAPES = {
    square: () => true,
    heart: (x, y) => { x *= 1.25; y = -y * 1.25 + 0.3; const a = x * x + y * y - 1; return a * a * a - x * x * y * y * y <= 0; },
    circle: (x, y) => x * x + y * y <= 1.02,
    diamond: (x, y) => Math.abs(x) + Math.abs(y) <= 1.08,
    ring: (x, y) => { const r = Math.hypot(x, y); return r <= 1.02 && r >= 0.42; },
    plus: (x, y) => Math.abs(x) < 0.42 || Math.abs(y) < 0.36,
    hourglass: (x, y) => Math.abs(x) <= Math.abs(y) * 0.95 + 0.2,
    trophy: ascii([
      '##################',
      '##################',
      '##  ##########  ##',
      '##  ##########  ##',
      ' ## ########## ## ',
      '  ############### ',
      '    ##########    ',
      '     ########     ',
      '      ######      ',
      '       ####       ',
      '       ####       ',
      '       ####       ',
      '      ######      ',
      '    ##########    ',
      '   ############   ',
      '   ############   '
    ]),
    cat: ascii([
      '##            ##',
      '###          ###',
      '####        ####',
      '################',
      '################',
      '################',
      '################',
      '################',
      '################',
      ' ############## ',
      '  ############  ',
      '    ########    ',
      '   ##########   ',
      '  ############  ',
      '  ############  ',
      '  ############  ',
      '  ####    ####  '
    ]),
    butterfly: ascii([
      '#####        #####',
      '#######    #######',
      '########  ########',
      '##################',
      '##################',
      ' ################ ',
      '  ##############  ',
      '    ##########    ',
      '  ##############  ',
      ' ################ ',
      '##################',
      '########  ########',
      '#######    #######',
      ' ####        #### '
    ]),
    house: ascii([
      '       ##       ',
      '      ####      ',
      '     ######     ',
      '    ########    ',
      '   ##########   ',
      '  ############  ',
      ' ############## ',
      '################',
      '  ############  ',
      '  ############  ',
      '  ############  ',
      '  ####    ####  ',
      '  ####    ####  ',
      '  ####    ####  '
    ])
  };
  const SHAPE_CYCLE = ['heart', 'trophy', 'circle', 'cat', 'diamond', 'butterfly', 'ring', 'house', 'hourglass', 'plus', 'square'];
  const SHAPE_NAMES = { square: 'Block', heart: 'Heart', circle: 'Moon', diamond: 'Gem', ring: 'Donut', plus: 'Cross',
    hourglass: 'Hourglass', trophy: 'Trophy', cat: 'Cat', butterfly: 'Butterfly', house: 'House' };

  function levelConfig(level) {
    const cols = Math.min(20, 5 + Math.floor((level - 1) * 0.75));
    const rows = Math.round(cols * 1.3);
    const shape = level <= 4 ? 'square' : SHAPE_CYCLE[(level - 5) % SHAPE_CYCLE.length];
    const maxLen = Math.min(16, 3 + Math.floor(level / 2));
    const f = SHAPES[shape];
    const mask = new Uint8Array(cols * rows);
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      mask[r * cols + c] = f((c + 0.5) / cols * 2 - 1, (r + 0.5) / rows * 2 - 1) ? 1 : 0;
    }
    return { cols, rows, mask, maxLen, shape };
  }

  function tryGenerate(cfg, R) {
    const { cols, rows, mask, maxLen } = cfg;
    const occ = new Int16Array(cols * rows).fill(-1);
    const inside = (c, r) => c >= 0 && r >= 0 && c < cols && r < rows;
    const free = (c, r) => inside(c, r) && mask[r * cols + c] && occ[r * cols + c] < 0;
    const lines = [];

    const cands = [];
    let maskCount = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (!mask[r * cols + c]) continue;
      maskCount++;
      const dx = (c + 0.5) / cols - 0.5, dy = (r + 0.5) / rows - 0.5;
      cands.push({ c, r, k: Math.hypot(dx, dy) + R() * 0.28 });
    }
    // Center-out placement: inner lines are placed first, so outer lines end up covering their lanes.
    cands.sort((a, b) => a.k - b.k);

    for (const cell of cands) {
      if (occ[cell.r * cols + cell.c] >= 0) continue;
      const order = [0, 1, 2, 3].sort(() => R() - 0.5);
      for (const di of order) {
        const [dx, dy] = DIRS[di];
        // Lane from head to edge must be clear of earlier lines.
        let ok = true;
        const lane = new Set();
        for (let c = cell.c + dx, r = cell.r + dy; inside(c, r); c += dx, r += dy) {
          if (occ[r * cols + c] >= 0) { ok = false; break; }
          lane.add(r * cols + c);
        }
        if (!ok) continue;
        const nc = cell.c - dx, nr = cell.r - dy;
        if (!free(nc, nr) || lane.has(nr * cols + nc)) continue;

        const body = [[cell.c, cell.r], [nc, nr]];
        const used = new Set([cell.r * cols + cell.c, nr * cols + nc]);
        const target = 2 + Math.floor(Math.pow(R(), 0.8) * (maxLen - 1));
        let dir = [-dx, -dy];
        while (body.length < target) {
          const [lc, lr] = body[body.length - 1];
          const straight = dir, left = [dir[1], -dir[0]], right = [-dir[1], dir[0]];
          const opts = R() < 0.55 ? [straight, R() < 0.5 ? left : right] : (R() < 0.5 ? [left, right, straight] : [right, left, straight]);
          let moved = false;
          for (const o of opts) {
            const c = lc + o[0], r = lr + o[1], id = r * cols + c;
            if (free(c, r) && !used.has(id) && !lane.has(id)) {
              body.push([c, r]); used.add(id); dir = o; moved = true; break;
            }
          }
          if (!moved) break;
        }
        const cells = body.reverse(); // tail -> head
        const idx = lines.length;
        for (const [c, r] of cells) occ[r * cols + c] = idx;
        lines.push({ cells, dir: [dx, dy] });
        break;
      }
    }

    // Densify: grow tails into empty neighbours. A cell may join line i only if it isn't in the
    // lane of line i or of any line placed after i (those lanes were required to be clear of line i).
    const laneOwners = new Map(); // cell -> max line index whose lane covers it
    lines.forEach((l, i) => {
      const [hc, hr] = l.cells[l.cells.length - 1];
      for (let c = hc + l.dir[0], r = hr + l.dir[1]; inside(c, r); c += l.dir[0], r += l.dir[1]) {
        const id = r * cols + c;
        laneOwners.set(id, Math.max(laneOwners.has(id) ? laneOwners.get(id) : -1, i));
      }
    });
    const growCap = maxLen + 4;
    for (let grew = true; grew;) {
      grew = false;
      lines.forEach((l, i) => {
        if (l.cells.length >= growCap) return;
        const [tc, tr] = l.cells[0];
        const nbs = DIRS.map(([dx, dy]) => [tc + dx, tr + dy]).sort(() => R() - 0.5);
        for (const [c, r] of nbs) {
          const id = r * cols + c;
          if (!free(c, r)) continue;
          if (laneOwners.has(id) && laneOwners.get(id) >= i) continue;
          l.cells.unshift([c, r]); occ[id] = i; grew = true;
          break;
        }
      });
    }

    const filled = lines.reduce((a, l) => a + l.cells.length, 0);
    let blocked = 0;
    for (let i = 0; i < lines.length; i++) if (laneBlocker(lines[i], occ, cols, rows, i) >= 0) blocked++;
    const shortOnes = lines.filter(l => l.cells.length <= 2).length;
    return {
      cols, rows, lines,
      score: filled / maskCount + 0.35 * blocked / Math.max(1, lines.length) - 0.25 * shortOnes / Math.max(1, lines.length)
    };
  }

  // Returns the lane distance (1-based) to the first blocking cell, or -1 if the lane is clear.
  function laneBlocker(line, occ, cols, rows, selfId) {
    const [hc, hr] = line.cells[line.cells.length - 1];
    const [dx, dy] = line.dir;
    let k = 1;
    for (let c = hc + dx, r = hr + dy; c >= 0 && r >= 0 && c < cols && r < rows; c += dx, r += dy, k++) {
      const o = occ[r * cols + c];
      if (o >= 0 && o !== selfId) return k;
    }
    return -1;
  }

  function generateLevel(level) {
    const cfg = levelConfig(level);
    let best = null;
    for (let a = 0; a < 8; a++) {
      const g = tryGenerate(cfg, mulberry(level * 7919 + a * 104729 + 13));
      if (!best || g.score > best.score) best = g;
    }
    best.shape = cfg.shape;
    return best;
  }

  // ================= Game state =================
  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
  let W = 0, H = 0, dpr = 1;
  let G = null;          // current level
  let lines = [];        // live lines
  let occ = null;
  let drops = 3, hints = 3, showGrid = false;
  let hintId = -1, hintUntil = 0;
  let guide = null;      // {id}
  let particles = [];
  let layout = { cs: 20, ox: 0, oy: 0 };
  let busyEnd = false;
  let colors = {};

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    const g = (n) => s.getPropertyValue(n).trim();
    colors = { ink: g('--ink'), accent: g('--accent'), danger: g('--danger'), line: g('--line'), board: g('--board'), muted: g('--muted'), title: g('--title') };
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', g('--panel'));
  }

  function rebuildOcc() {
    occ = new Int16Array(G.cols * G.rows).fill(-1);
    for (const l of lines) {
      if (l.state === 'exit' || l.state === 'gone') continue;
      for (const [c, r] of l.cells) occ[r * G.cols + c] = l.id;
    }
  }

  function startLevel(n) {
    save.level = n; persist();
    G = generateLevel(n);
    G.level = n;
    lines = G.lines.map((l, i) => ({ id: i, cells: l.cells, dir: l.dir, state: 'idle', s: 0, v: 0, t: 0, flash: 0, path: null }));
    rebuildOcc();
    drops = 3; hints = 3; hintId = -1; guide = null; particles = []; busyEnd = false;
    $('levelTitle').textContent = `Level ${n}`;
    ['winVeil', 'loseVeil'].forEach(v => $(v).classList.remove('show'));
    const tips = {
      1: 'Tap a line. It slides out the way its arrow points.',
      2: 'If another line is in the way, you lose a 💧.',
      3: 'Hold a line down to see where it will go.',
      4: 'Stuck? The 💡 finds a line that is free to go.'
    };
    $('tip').textContent = tips[n] || `${SHAPE_NAMES[G.shape] || ''} · ${lines.length} lines`;
    fit(); renderDrops(); renderHud();
  }

  function renderDrops() {
    const el = $('drops');
    el.innerHTML = '';
    for (let i = 0; i < 3; i++) el.appendChild(dropSvg(i >= drops));
  }
  function dropSvg(lost) {
    const ns = 'http://www.w3.org/2000/svg';
    const s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 18 24'); s.setAttribute('class', 'drop' + (lost ? ' lost' : ''));
    s.innerHTML = '<path d="M9 1C9 1 1.5 10 1.5 15.3A7.5 7.5 0 0 0 16.5 15.3C16.5 10 9 1 9 1Z" fill="#3b8fd9"/><ellipse cx="6" cy="15" rx="1.8" ry="3" fill="#fff" opacity=".55"/>';
    return s;
  }
  function renderHud() {
    const left = lines.filter(l => l.state !== 'exit' && l.state !== 'gone').length;
    $('leftCount').textContent = `${left} left`;
    const b = $('hintBadge');
    b.textContent = hints; b.classList.toggle('zero', hints === 0);
  }

  // ================= Layout =================
  function fit() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!G) return;
    const pad = 20;
    const cs = Math.max(8, Math.floor(Math.min((W - pad * 2) / G.cols, (H - pad * 2) / G.rows)));
    layout = { cs, ox: Math.round((W - cs * G.cols) / 2), oy: Math.round((H - cs * G.rows) / 2) };
  }
  let lastKey = '';
  const onResize = () => {
    const r = stage.getBoundingClientRect();
    const k = `${Math.round(r.width)}x${Math.round(r.height)}@${window.devicePixelRatio}`;
    if (k !== lastKey) { lastKey = k; fit(); }
  };
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
  window.addEventListener('resize', onResize);

  const px = (c) => layout.ox + (c + 0.5) * layout.cs;
  const py = (r) => layout.oy + (r + 0.5) * layout.cs;

  // Full travel path for a line: its cells, then its lane extended past the board edge.
  function buildPath(l) {
    const P = l.cells.map(([c, r]) => [c, r]);
    const [hc, hr] = l.cells[l.cells.length - 1];
    const [dx, dy] = l.dir;
    const extra = Math.max(G.cols, G.rows) + l.cells.length + 4;
    for (let i = 1; i <= extra; i++) P.push([hc + dx * i, hr + dy * i]);
    return P;
  }
  function stepsToExit(l) {
    const [hc, hr] = l.cells[l.cells.length - 1];
    const [dx, dy] = l.dir;
    let k = 0;
    for (let c = hc, r = hr; c >= 0 && r >= 0 && c < G.cols && r < G.rows; c += dx, r += dy) k++;
    return k - 1 + l.cells.length + 1; // head to edge, then whole body past it
  }

  // ================= Actions =================
  function tapLine(l) {
    if (l.state !== 'idle' || busyEnd) return;
    const k = laneBlocker(l, occ, G.cols, G.rows, l.id);
    l.path = buildPath(l);
    if (hintId === l.id) hintId = -1;
    if (k < 0) {
      l.state = 'exit'; l.s = 0; l.v = 14; l.goal = stepsToExit(l);
      rebuildOcc();
      whoosh(l.cells.length); vibe(8);
      renderHud();
    } else {
      l.state = 'bump'; l.t = 0; l.reach = Math.max(0.25, k - 1 + 0.3);
      const other = lines.find(o => o.id === occ[laneCell(l, k)]);
      if (other) other.flash = 1;
      l.flash = 1.4;
      drops--;
      bumpSound(); vibe([30, 40, 30]);
      renderDrops();
      const el = $('drops').children[Math.max(0, drops)];
      if (el) el.classList.add('shake');
      if (drops <= 0) { busyEnd = true; setTimeout(() => $('loseVeil').classList.add('show'), 650); }
    }
  }
  function laneCell(l, k) {
    const [hc, hr] = l.cells[l.cells.length - 1];
    return (hr + l.dir[1] * k) * G.cols + (hc + l.dir[0] * k);
  }

  function useHint() {
    if (busyEnd) return;
    if (hints <= 0) { $('tip').textContent = 'No hints left on this level.'; return; }
    const freeOnes = lines.filter(l => l.state === 'idle' && laneBlocker(l, occ, G.cols, G.rows, l.id) < 0);
    if (!freeOnes.length) return;
    // Prefer the free line that unblocks the most other lines.
    let best = freeOnes[0], bestScore = -1;
    for (const f of freeOnes) {
      const set = new Set(f.cells.map(([c, r]) => r * G.cols + c));
      let score = 0;
      for (const o of lines) {
        if (o.state !== 'idle' || o === f) continue;
        const k = laneBlocker(o, occ, G.cols, G.rows, o.id);
        if (k > 0 && set.has(laneCell(o, k))) score++;
      }
      if (score > bestScore) { bestScore = score; best = f; }
    }
    hints--; hintId = best.id; hintUntil = performance.now() + 4000;
    hintSound(); renderHud();
  }

  function checkWin() {
    if (busyEnd) return;
    if (lines.every(l => l.state === 'gone')) {
      busyEnd = true;
      winSound(); vibe([20, 50, 20, 50, 40]);
      for (let i = 0; i < 90; i++) {
        particles.push({ x: W / 2, y: H / 2, vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.9) * 12, life: 1, size: 4 + Math.random() * 5,
          color: ['#3b8fd9', colors.title, colors.accent, '#e25c4a', '#4cb783'][i % 5], rot: Math.random() * 6 });
      }
      const n = save.level;
      save.best[n] = Math.max(save.best[n] || 0, drops);
      persist();
      $('winTitle').textContent = drops === 3 ? 'Perfect!' : 'Board clear!';
      const wd = $('winDrops'); wd.innerHTML = '';
      for (let i = 0; i < 3; i++) wd.appendChild(dropSvg(i >= drops));
      $('winText').textContent = drops === 3 ? 'You didn\'t bump a single line.' : `Level ${n} cleared. Replay it without a bump for a perfect score.`;
      setTimeout(() => $('winVeil').classList.add('show'), 700);
    }
  }

  // ================= Input =================
  function lineAt(x, y) {
    const { cs, ox, oy } = layout;
    const fc = (x - ox) / cs - 0.5, fr = (y - oy) / cs - 0.5;
    let best = null, bd = 0.85; // in cells
    const c0 = Math.round(fc), r0 = Math.round(fr);
    for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
      if (c < 0 || r < 0 || c >= G.cols || r >= G.rows) continue;
      const id = occ[r * G.cols + c];
      if (id < 0) continue;
      const d = Math.hypot(c - fc, r - fr);
      if (d < bd) { bd = d; best = lines[id]; }
    }
    return best;
  }

  let press = null;
  cv.addEventListener('pointerdown', (e) => {
    if (!G || busyEnd) return;
    audio();
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const l = lineAt(x, y);
    press = { x, y, l, timer: 0, long: false };
    if (l) {
      press.timer = setTimeout(() => {
        if (press && press.l && press.l.state === 'idle') { press.long = true; guide = { id: press.l.id }; vibe(10); }
      }, 320);
    }
  });
  cv.addEventListener('pointermove', (e) => {
    if (!press) return;
    const r = cv.getBoundingClientRect();
    if (Math.hypot(e.clientX - r.left - press.x, e.clientY - r.top - press.y) > 14 && !press.long) {
      clearTimeout(press.timer); press = null;
    }
  });
  const release = () => {
    if (!press) return;
    clearTimeout(press.timer);
    if (!press.long && press.l) tapLine(press.l);
    press = null; guide = null;
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', () => { if (press) clearTimeout(press.timer); press = null; guide = null; });

  // ================= Drawing =================
  function pointAt(P, s) {
    const i = Math.max(0, Math.min(P.length - 2, Math.floor(s)));
    const t = s - i;
    return [P[i][0] + (P[i + 1][0] - P[i][0]) * t, P[i][1] + (P[i + 1][1] - P[i][1]) * t];
  }
  function drawLine(P, s, len, color, width, withHead = true) {
    const { cs } = layout;
    const a = s, b = s + len - 1;
    const pts = [pointAt(P, a)];
    for (let i = Math.floor(a) + 1; i < b; i++) pts.push(P[i]);
    pts.push(pointAt(P, b));
    ctx.beginPath();
    ctx.moveTo(px(pts[0][0]), py(pts[0][1]));
    for (let i = 1; i < pts.length; i++) ctx.lineTo(px(pts[i][0]), py(pts[i][1]));
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'square'; ctx.lineJoin = 'miter';
    ctx.stroke();
    if (!withHead) return;
    const j = Math.max(0, Math.min(P.length - 2, Math.floor(b + 1e-6)));
    const dx = P[j + 1][0] - P[j][0], dy = P[j + 1][1] - P[j][1];
    const hx = px(pts[pts.length - 1][0]), hy = py(pts[pts.length - 1][1]);
    const tip = cs * 0.46, back = cs * 0.02, half = Math.max(width * 1.9, cs * 0.24);
    ctx.beginPath();
    ctx.moveTo(hx + dx * tip, hy + dy * tip);
    ctx.lineTo(hx - dx * back - dy * half, hy - dy * back + dx * half);
    ctx.lineTo(hx - dx * back + dy * half, hy - dy * back - dx * half);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
  }

  function mix(hexA, hexB, t) {
    const p = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
    try {
      const a = p(hexA), b = p(hexB);
      return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`;
    } catch (e) { return hexA; }
  }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H);
    if (!G) return;
    const { cs, ox, oy } = layout;
    const lw = Math.max(1.6, cs * 0.13);

    if (showGrid) {
      ctx.fillStyle = colors.line;
      for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) {
        ctx.beginPath(); ctx.arc(px(c), py(r), Math.max(1, cs * 0.07), 0, Math.PI * 2); ctx.fill();
      }
      ctx.strokeStyle = colors.line; ctx.lineWidth = 1.5;
      ctx.strokeRect(ox - 0.5, oy - 0.5, cs * G.cols + 1, cs * G.rows + 1);
    }

    // Guidance lane
    if (guide) {
      const l = lines[guide.id];
      if (l && l.state === 'idle') {
        const k = laneBlocker(l, occ, G.cols, G.rows, l.id);
        const [hc, hr] = l.cells[l.cells.length - 1];
        const steps = k < 0 ? Math.max(G.cols, G.rows) : k - 0.5;
        ctx.save();
        ctx.setLineDash([cs * 0.25, cs * 0.25]);
        ctx.strokeStyle = k < 0 ? colors.accent : colors.danger;
        ctx.lineWidth = Math.max(2, lw);
        ctx.beginPath();
        ctx.moveTo(px(hc), py(hr));
        ctx.lineTo(px(hc + l.dir[0] * steps), py(hr + l.dir[1] * steps));
        ctx.stroke();
        ctx.restore();
      }
    }

    const hintOn = hintId >= 0 && now < hintUntil;
    let anyGone = false;
    for (const l of lines) {
      if (l.state === 'gone') continue;
      l.flash = Math.max(0, l.flash - dt * 1.4);
      let color = l.flash > 0 ? mix(colors.ink, colors.danger, Math.min(1, l.flash)) : colors.ink;

      if (l.state === 'idle') {
        if (hintOn && l.id === hintId) {
          const pulse = 0.5 + 0.5 * Math.sin(now / 140);
          ctx.globalAlpha = 0.25 + 0.3 * pulse;
          drawLine(l.cells, 0, l.cells.length, colors.accent, lw * 3.4, false);
          ctx.globalAlpha = 1;
          color = colors.accent;
        }
        if (guide && guide.id === l.id) color = colors.accent;
        drawLine(l.cells, 0, l.cells.length, color, lw);
      } else if (l.state === 'exit') {
        l.v = Math.min(60, l.v + 90 * dt);
        l.s += l.v * dt;
        const inBoard = 1 - Math.max(0, Math.min(1, (l.s - (l.goal - l.cells.length)) / l.cells.length));
        ctx.globalAlpha = Math.max(0.15, inBoard);
        drawLine(l.path, l.s, l.cells.length, colors.ink, lw);
        ctx.globalAlpha = 1;
        if (l.s >= l.goal) { l.state = 'gone'; anyGone = true; }
      } else if (l.state === 'bump') {
        l.t += dt;
        const T = 0.34;
        const u = l.t / T;
        const s = u < 0.5 ? l.reach * Math.sin(u * Math.PI) : l.reach * Math.sin(u * Math.PI) * 0.9;
        drawLine(l.path, Math.max(0, s), l.cells.length, color, lw);
        if (l.t >= T) { l.state = 'idle'; }
      }
    }
    if (anyGone) { renderHud(); checkWin(); }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += 22 * dt; p.x += p.vx; p.y += p.vy; p.life -= dt * 0.6; p.rot += 0.2;
      if (p.life <= 0 || p.y > H + 20) { particles.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    }
  }

  // ================= Themes & settings =================
  const THEMES = ['paper', 'night', 'mint'];
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    save.theme = t; persist(); readColors();
  }
  let initialTheme = save.theme;
  if (!initialTheme) {
    try { initialTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper'; } catch (e) { initialTheme = 'paper'; }
  }
  document.documentElement.setAttribute('data-theme', initialTheme);
  readColors();

  $('themeBtn').addEventListener('click', () => applyTheme(THEMES[(THEMES.indexOf(save.theme || initialTheme) + 1) % THEMES.length]));
  $('gridBtn').addEventListener('click', () => { showGrid = !showGrid; $('gridBtn').classList.toggle('on', showGrid); });
  $('hintBtn').addEventListener('click', useHint);
  $('homeBtn').addEventListener('click', () => { $('startLevel').textContent = `Level ${save.level}`; $('startVeil').classList.add('show'); });
  $('playBtn').addEventListener('click', () => { audio(); $('startVeil').classList.remove('show'); if (!G || G.level !== save.level) startLevel(save.level); });
  $('nextBtn').addEventListener('click', () => startLevel(save.level + 1));
  $('replayBtn').addEventListener('click', () => startLevel(save.level));
  $('retryBtn').addEventListener('click', () => startLevel(save.level));
  $('settingsBtn').addEventListener('click', () => $('setVeil').classList.add('show'));
  $('setClose').addEventListener('click', () => $('setVeil').classList.remove('show'));
  $('restartBtn').addEventListener('click', () => { $('setVeil').classList.remove('show'); startLevel(save.level); });
  const swS = $('swSound'), swV = $('swVibe');
  swS.classList.toggle('on', save.sound); swV.classList.toggle('on', save.vibe);
  swS.addEventListener('click', () => { save.sound = !save.sound; swS.classList.toggle('on', save.sound); persist(); });
  swV.addEventListener('click', () => { save.vibe = !save.vibe; swV.classList.toggle('on', save.vibe); persist(); });

  // Boot
  $('startLevel').textContent = `Level ${save.level}`;
  startLevel(save.level);
  onResize();
  requestAnimationFrame(frame);

  // Exposed for automated checks only.
  window.__laneOut = { generateLevel, laneBlocker, levelConfig, debug: () => ({ layout, lines: lines.map(l => ({ id: l.id, state: l.state, cells: l.cells })) }) };
})();
</script>
</body>
</html>
